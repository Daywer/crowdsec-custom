name: local/3x-ui-logs
description: "Parse 3x-ui failed login attempts"
filter: "evt.Line.Raw contains 'failed login:'"
onsuccess: next_stage
nodes:
  - grok:
      pattern: '%{YEAR}/%{MONTHNUM}/%{MONTHDAY} %{TIME:timestamp} WARNING - failed login: username="%{DATA:username}", IP="%{IP:source_ip}", reason="%{DATA:reason}"'
      apply_on: Line.Raw
    statics:
      - meta: log_type
        value: 3x-ui_failed_login
      - meta: service
        value: 3x-ui
      - meta: source_ip
        expression: evt.Parsed.source_ip
      - meta: username
        expression: evt.Parsed.username
      - meta: reason
        expression: evt.Parsed.reason
